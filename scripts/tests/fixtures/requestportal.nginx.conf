server {
    listen 80;
    listen [::]:80;

    server_name requestportal.ffpja.org relief.ffpja.org help.ffpja.org helpme.ffpja.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name requestportal.ffpja.org relief.ffpja.org help.ffpja.org helpme.ffpja.org;

    ssl_certificate     /etc/ssl/ffpja.org/adminCertificates.fullchain;
    ssl_certificate_key /etc/ssl/ffpja.org/adminCertificates.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:5401;
        proxy_http_version 1.1;

	proxy_buffer_size 16k;
	proxy_buffers 8 16k;
	proxy_busy_buffers_size 32k;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
