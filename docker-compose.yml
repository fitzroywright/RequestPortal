services:
  postgres:
    image: postgres:17-alpine
    container_name: requestportal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: requestportal
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - requestportal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d requestportal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  requestportal-postgres-data:
