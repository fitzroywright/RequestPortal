name: Coordinated security regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RequestPortal
    services:
      postgres:
        # Production currently runs PostgreSQL 13. Standard CI separately covers 16.
        image: postgres:13
        env:
          POSTGRES_USER: security_tests
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: security_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U security_tests -d security_tests"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      REQUESTPORTAL_POSTGRES: Host=localhost;Port=5432;Database=security_tests;Username=security_tests;Password=isolated_ci_only
      STUDIO_TEST_POSTGRES: Host=localhost;Port=5432;Database=security_tests;Username=security_tests;Password=isolated_ci_only
    steps:
      - uses: actions/checkout@v4
        with:
          path: RequestPortal
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Security
          ref: c0e1a1f0f1f6b3303ec28bf47fcb7a52c9af6748
          path: Common/Common.Security
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          ref: aea6757ff483be0d9262a9d239dea69ed2703eed
          path: Common/Common.Diagnostics
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Secrets
          ref: 21bee850d29f7a5a58d3fa3d3793272799682e6a
          path: Common/Common.Secrets
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Messaging
          ref: 1e85458baa6624826eeb32cc56bacbcfe053568c
          path: Common/Common.Messaging
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Storage
          ref: c9cf0b599ea1295d63f39145cb1b25d1275d46a5
          path: Common/Common.Storage
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Registration
          ref: bfed9a94d38a3f23cc020d40bc811df49e789724
          path: Common/Common.Registration
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Verify shared source revisions
        run: python3 ../Common/Common.Security/scripts/verify-source-baseline.py security-baseline.json --common-root ../Common
      - name: Test scoped directory commissioning and rollback
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Test application security and business regressions
        run: |
          dotnet test RequestPortal.Tests/RequestPortal.Domain.Tests/RequestPortal.Domain.Tests.csproj -c Release -p:CommonRoot="$GITHUB_WORKSPACE/Common" --logger trx --results-directory TestResults
          # LiveFfpSql is an explicit opt-in rehearsal category requiring JMDB01/Kerberos.
          # Standard CI reports those unavailable tests as skips; this portable security
          # gate still requires every selected security/business test to pass without skips.
          dotnet test RequestPortal.Tests/RequestPortal.Infrastructure.Tests/RequestPortal.Infrastructure.Tests.csproj -c Release -p:CommonRoot="$GITHUB_WORKSPACE/Common" --filter "Category!=LiveFfpSql" --logger trx --results-directory TestResults
      - name: Build protected identity migration tool
        run: dotnet build RequestPortal.SecurityMigration/RequestPortal.SecurityMigration.csproj -c Release -p:CommonRoot="$GITHUB_WORKSPACE/Common"
      - name: Reject skipped or empty test evidence
        if: always()
        run: |
          python3 - <<'PYGATE'
          import pathlib,sys,xml.etree.ElementTree as ET
          files=list(pathlib.Path('TestResults').glob('*.trx'))
          failures=[]
          if not files: failures.append('No test evidence was produced.')
          for file in files:
              root=ET.parse(file).getroot()
              counters=root.find('.//{*}Counters')
              if counters is None or int(counters.get('total','0'))==0 or int(counters.get('passed','0'))!=int(counters.get('total','0')):
                  failures.append(str(file)+': failed, skipped or empty results block release.')
          print('\n'.join(failures) if failures else 'All recorded tests passed without skips.')
          sys.exit(bool(failures))
          PYGATE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-regression-evidence
          path: RequestPortal/TestResults
