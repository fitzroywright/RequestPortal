name: Request Portal CI

on:
  push:
    branches:
      - main
      - chatgpt/mvp-rescue
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/RequestPortal.Web/RequestPortal.Web.csproj

      - name: Build
        run: dotnet build src/RequestPortal.Web/RequestPortal.Web.csproj --configuration Release --no-restore

      - name: Generate initial migration for review
        if: ${{ hashFiles('src/RequestPortal.Infrastructure/Persistence/Migrations/*.cs') == '' }}
        run: |
          dotnet tool restore
          dotnet ef migrations add InitialProduction --project src/RequestPortal.Infrastructure --startup-project src/RequestPortal.Web --output-dir Persistence/Migrations
          echo '=== BEGIN GENERATED MIGRATION FILES ==='
          for f in src/RequestPortal.Infrastructure/Persistence/Migrations/*.cs; do
            echo "=== FILE: $f ==="
            cat "$f"
          done
          echo '=== END GENERATED MIGRATION FILES ==='

      - name: Test
        run: |
          if find tests -name '*.csproj' -print -quit 2>/dev/null | grep -q .; then
            find tests -name '*.csproj' -print0 | xargs -0 -n1 dotnet test --configuration Release
          else
            echo 'No test projects yet.'
          fi
