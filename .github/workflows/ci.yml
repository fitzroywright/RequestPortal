name: Request Portal CI

on:
  push:
    branches:
      - main
      - chatgpt/mvp-rescue
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RequestPortal
        uses: actions/checkout@v4

      - name: Checkout Common.Diagnostics
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          path: Common/Common.Diagnostics

      - name: Mirror sibling Common layout
        shell: pwsh
        run: |
          $siblingCommon = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'Common'
          if (Test-Path $siblingCommon) { Remove-Item $siblingCommon -Recurse -Force }
          Move-Item (Join-Path $env:GITHUB_WORKSPACE 'Common') $siblingCommon

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/RequestPortal.Web/RequestPortal.Web.csproj

      - name: Build
        run: dotnet build src/RequestPortal.Web/RequestPortal.Web.csproj --configuration Release --no-restore

      - name: Verify migration model is current
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/RequestPortal.Infrastructure --startup-project src/RequestPortal.Web

      - name: Test
        run: |
          if find tests -name '*.csproj' -print -quit 2>/dev/null | grep -q .; then
            find tests -name '*.csproj' -print0 | xargs -0 -n1 dotnet test --configuration Release
          else
            echo 'No test projects yet.'
          fi
