name: Request Portal CI

on:
  push:
    branches:
      - main
      - chatgpt/mvp-rescue
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/RequestPortal.Web/RequestPortal.Web.csproj

      - name: Build
        run: dotnet build src/RequestPortal.Web/RequestPortal.Web.csproj --configuration Release --no-restore

      - name: Generate initial production migration
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/mvp-rescue' && hashFiles('src/RequestPortal.Infrastructure/Persistence/Migrations/*.cs') == '' }}
        run: |
          dotnet tool restore
          dotnet ef migrations add InitialProduction --project src/RequestPortal.Infrastructure --startup-project src/RequestPortal.Web --output-dir Persistence/Migrations
          git config user.name "Request Portal CI"
          git config user.email "actions@github.com"
          git add src/RequestPortal.Infrastructure/Persistence/Migrations
          git commit -m "Add initial production database migration"
          git push origin HEAD:chatgpt/mvp-rescue

      - name: Verify migration model is current
        if: ${{ hashFiles('src/RequestPortal.Infrastructure/Persistence/Migrations/*.cs') != '' }}
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/RequestPortal.Infrastructure --startup-project src/RequestPortal.Web

      - name: Test
        run: |
          if find tests -name '*.csproj' -print -quit 2>/dev/null | grep -q .; then
            find tests -name '*.csproj' -print0 | xargs -0 -n1 dotnet test --configuration Release
          else
            echo 'No test projects yet.'
          fi
