name: Request Portal CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: requestportal
          POSTGRES_PASSWORD: requestportal_ci
          POSTGRES_DB: requestportal_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U requestportal -d requestportal_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REQUESTPORTAL_POSTGRES: Host=localhost;Port=5432;Database=requestportal_tests;Username=requestportal;Password=requestportal_ci

    steps:
      - name: Checkout RequestPortal
        uses: actions/checkout@v4

      - name: Check for tracked build and IDE artifacts
        shell: bash
        run: |
          tracked_artifacts=$(git ls-files -- ':(glob,icase)**/bin/**' ':(glob,icase)**/obj/**' ':(glob,icase)**/.vs/**')
          if [ -n "$tracked_artifacts" ]; then
            printf '%s\n' 'Remove generated build and IDE files from Git:' "$tracked_artifacts" >&2
            exit 1
          fi

      - name: Checkout Common.Diagnostics
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          ref: aea6757ff483be0d9262a9d239dea69ed2703eed
          path: Common/Common.Diagnostics

      - name: Checkout Common.Security
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Security
          ref: c0e1a1f0f1f6b3303ec28bf47fcb7a52c9af6748
          path: Common/Common.Security

      - name: Checkout Common.Secrets
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Secrets
          ref: 21bee850d29f7a5a58d3fa3d3793272799682e6a
          path: Common/Common.Secrets

      - name: Checkout Common.Messaging
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Messaging
          ref: 1e85458baa6624826eeb32cc56bacbcfe053568c
          path: Common/Common.Messaging

      - name: Checkout Common.Storage
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Storage
          ref: c9cf0b599ea1295d63f39145cb1b25d1275d46a5
          path: Common/Common.Storage

      - name: Checkout Common.Registration
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Registration
          ref: bfed9a94d38a3f23cc020d40bc811df49e789724
          path: Common/Common.Registration

      - name: Mirror sibling Common layout
        shell: pwsh
        run: |
          $siblingCommon = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'Common'
          if (Test-Path $siblingCommon) { Remove-Item $siblingCommon -Recurse -Force }
          Move-Item (Join-Path $env:GITHUB_WORKSPACE 'Common') $siblingCommon

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore RequestPortal
        run: dotnet restore RequestPortal.Web/RequestPortal.Web.csproj

      - name: Build RequestPortal Debug
        run: dotnet build RequestPortal.Web/RequestPortal.Web.csproj --configuration Debug --no-restore

      - name: Build RequestPortal Release
        run: dotnet build RequestPortal.Web/RequestPortal.Web.csproj --configuration Release --no-restore

      - name: Restore FFP Manager bridge
        run: dotnet restore FfpManager.Bridge/FfpManager.Bridge.csproj

      - name: Build FFP Manager bridge Debug
        run: dotnet build FfpManager.Bridge/FfpManager.Bridge.csproj --configuration Debug --no-restore

      - name: Build FFP Manager bridge Release
        run: dotnet build FfpManager.Bridge/FfpManager.Bridge.csproj --configuration Release --no-restore

      - name: Build fixed read-only integration audit
        run: dotnet build tools/RequestPortal.IntegrationAudit --configuration Release

      - name: Verify read-only reconciliation and diagnostic redaction
        run: python3 scripts/tests/test_integration_audit.py

      - name: Verify migration model is current
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project RequestPortal.Infrastructure --startup-project RequestPortal.Web

      - name: Test Debug
        run: |
          find RequestPortal.Tests -name '*.csproj' -print0 | xargs -0 -n1 dotnet test --configuration Debug

      - name: Test Release
        env:
          REQUESTPORTAL_QI_RENDER_OUTPUT: ${{ runner.temp }}/requestportal-quick-intake
          REQUESTPORTAL_RU_RENDER_OUTPUT: ${{ runner.temp }}/requestportal-registered-users
          REQUESTPORTAL_DASHBOARD_RENDER_OUTPUT: ${{ runner.temp }}/requestportal-dashboard
          REQUESTPORTAL_IDENTITY_RENDER_OUTPUT: ${{ runner.temp }}/requestportal-identities
          REQUESTPORTAL_STAFF_NAV_RENDER_OUTPUT: ${{ runner.temp }}/requestportal-staff-navigation
        run: |
          find RequestPortal.Tests -name '*.csproj' -print0 | xargs -0 -n1 dotnet test --configuration Release

      - name: Verify flat layouts and interactive map in Chromium
        env:
          REQUESTPORTAL_QI_RENDER_OUTPUT: ${{ runner.temp }}/requestportal-quick-intake
          REQUESTPORTAL_RU_RENDER_OUTPUT: ${{ runner.temp }}/requestportal-registered-users
          REQUESTPORTAL_DASHBOARD_RENDER_OUTPUT: ${{ runner.temp }}/requestportal-dashboard
          REQUESTPORTAL_IDENTITY_RENDER_OUTPUT: ${{ runner.temp }}/requestportal-identities
          REQUESTPORTAL_STAFF_NAV_RENDER_OUTPUT: ${{ runner.temp }}/requestportal-staff-navigation
        run: |
          npm install --prefix "$RUNNER_TEMP/portal-browser" --no-save --ignore-scripts playwright@1.64.1
          node "$RUNNER_TEMP/portal-browser/node_modules/playwright/cli.js" install --with-deps chromium
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/portal-browser/node_modules/playwright"
          node scripts/tests/test_management_dashboard.cjs
          node scripts/tests/test_reports_dashboards.cjs
          node scripts/tests/test_flat_pages.cjs
          node scripts/tests/test_staff_search_navigation.cjs
          node scripts/tests/test_integrations_viewport.cjs
