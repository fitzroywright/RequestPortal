name: Request Portal CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RequestPortal
        uses: actions/checkout@v4

      - name: Checkout Common.Diagnostics
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          path: Common/Common.Diagnostics

      - name: Checkout Common.Security
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Security
          path: Common/Common.Security

      - name: Checkout Common.Secrets
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Secrets
          path: Common/Common.Secrets

      - name: Checkout Common.Messaging
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Messaging
          path: Common/Common.Messaging

      - name: Checkout Common.Storage
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Storage
          path: Common/Common.Storage

      - name: Checkout Common.Registration
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Registration
          path: Common/Common.Registration

      - name: Mirror sibling Common layout
        shell: pwsh
        run: |
          $siblingCommon = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'Common'
          if (Test-Path $siblingCommon) { Remove-Item $siblingCommon -Recurse -Force }
          Move-Item (Join-Path $env:GITHUB_WORKSPACE 'Common') $siblingCommon

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore RequestPortal
        run: dotnet restore RequestPortal.Web/RequestPortal.Web.csproj

      - name: Build RequestPortal
        run: dotnet build RequestPortal.Web/RequestPortal.Web.csproj --configuration Release --no-restore

      - name: Restore FFP Manager bridge
        run: dotnet restore FfpManager.Bridge/FfpManager.Bridge.csproj

      - name: Build FFP Manager bridge
        run: dotnet build FfpManager.Bridge/FfpManager.Bridge.csproj --configuration Release --no-restore

      - name: Verify migration model is current
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project RequestPortal.Infrastructure --startup-project RequestPortal.Web

      - name: Test
        run: |
          find RequestPortal.Tests -name '*.csproj' -print0 | xargs -0 -n1 dotnet test --configuration Release